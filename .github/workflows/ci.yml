name: CI

# Linux runs on every push and PR. The macOS leg costs ~10x a Linux minute, so
# it runs only where macOS can actually behave differently:
#   - release tags (v*) and manual runs (workflow_dispatch)
#   - changes to code that branches on the platform: the OS keychain and its
#     native dependency, browser opening, the per-OS config path, fs moves and
#     trash, the Claude Desktop bundle (mcpb), and the darwin-only tests.
# Release publishing itself stays in release.yml (ubuntu only).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only read the repo. Elevate per job if one ever needs more.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      macos: ${{ steps.decide.outputs.macos }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: github.event_name == 'push' && github.ref_type == 'branch' || github.event_name == 'pull_request'
        with:
          filters: |
            macos:
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'mcpb/**'
              - 'scripts/build-mcpb.mjs'
              - 'src/fsops.mjs'
              - 'src/trash.mjs'
              - 'src/roots.mjs'
              - 'src/vault/credential.mjs'
              - 'src/vault/connect.mjs'
              - 'src/vault/cli.mjs'
              - 'src/tools/vaultConnect.mjs'
              - 'test/helpers.mjs'
              - 'test/credential.test.mjs'
              - 'test/connect.test.mjs'
              - 'test/cross-device.test.mjs'
              - 'test/regressions.test.mjs'
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          FILTERED: ${{ steps.filter.outputs.macos }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$REF_TYPE" = "tag" ] || [ "$FILTERED" = "true" ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  test-macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
