name: release

# Publishes @shieldfive/mcp to npm WITH provenance when a version tag (vX.Y.Z)
# is pushed, and attaches the Claude Desktop bundle to the GitHub release.
#
# Why this exists: `npm publish` from a laptop needs an interactive browser
# approval for 2FA, so every release waited on a human at a terminal. An
# automation token in CI publishes without that, and provenance links the
# tarball to this exact commit and run — a stronger claim than a laptop upload.
#
# ── ONE-TIME SETUP ───────────────────────────────────────────────────────────
#   Trusted publishing (OIDC), not a token. npm now requires 2FA for direct
#   publishes even with an automation token (EOTP in CI, 2026-09-21), and its
#   replacement is for the registry to trust THIS workflow directly:
#     npmjs.com → @shieldfive/mcp → Settings → Trusted Publisher →
#       GitHub Actions · shieldfive/mcp · workflow release.yml
#   No secret is involved. id-token: write (below) is what npm verifies, and
#   provenance is produced as part of the same exchange.
#
# ── HARDENING (Batch I, 2026-10) ─────────────────────────────────────────────
#   Three jobs. `build` has no write permission and no OIDC token: it installs
#   with --ignore-scripts (no dependency code runs at install), tests, checks
#   the tag, packs the exact tarball and builds the .mcpb. `publish` holds
#   id-token: write but never installs or runs dependency code: it downloads
#   the tarball `build` produced and publishes THAT file. It runs in the
#   `npm-publish` environment, which the org admin protects with a required
#   reviewer and a v* deployment-tag rule (see docs/release-hardening.md).
#   `release-asset` attaches the bundle once npm has the version.
#   npm itself is pinned to one exact version (trusted publishing needs
#   >= 11.5.1).
#
# ── RELEASE FLOW ─────────────────────────────────────────────────────────────
#   merge the release PR → push an annotated tag vX.Y.Z at the merge commit.
#   The MCP registry listing is published by registry.yml on the same tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to publish (e.g. v0.4.1)'
        required: true

permissions:
  contents: read

env:
  NPM_VERSION: 11.6.2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      channel: ${{ steps.ver.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No registry-url: that writes an .npmrc auth line expecting a token,
          # and an empty one gets in the way of the OIDC exchange.
          cache: npm

      - run: npm install -g "npm@${NPM_VERSION}"
      # No lifecycle scripts: nothing in the lockfile needs one (no
      # hasInstallScript entries), and a compromised dependency's postinstall
      # is the classic way into a release job.
      - run: npm ci --ignore-scripts
      - run: npm test

      - name: Resolve version and verify it matches the tag
        id: ver
        env:
          # Untrusted input (the pushed tag name or dispatch ref) goes through
          # env and is never interpolated into the shell: ref names permit
          # `$()`, backticks, `;`, `|` and `&`.
          TAG_REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${TAG_REF#v}"
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if [[ ! "$PKG_VERSION" =~ $semver_re ]]; then
            echo "::error::package.json version is not a clean semver string"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag (=$TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi
          if [[ "$PKG_VERSION" == *-* ]]; then
            CHANNEL="$(echo "$PKG_VERSION" | sed -E 's/.*-([a-zA-Z]+).*/\1/')"
          else
            CHANNEL="latest"
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Pack the exact tarball that will be published
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          ls -l dist
          sha256sum dist/*.tgz

      # The bundle is built from the tag, so what people install from the
      # release page is the code that was published, not whatever main holds.
      - name: Build the Claude Desktop bundle
        run: npm run build:mcpb

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.tgz
            dist/shieldfive.mcpb
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Protected by the org admin: required reviewer + deployment tags v* only.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # REQUIRED for npm trusted publishing + provenance (OIDC)
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g "npm@${NPM_VERSION}"

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - name: Skip if this version is already on npm
        id: check
        env:
          VER: ${{ needs.build.outputs.version }}
        run: |
          if npm view "@shieldfive/mcp@${VER}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@shieldfive/mcp@${VER} is already published — skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the built tarball to npm with provenance
        if: steps.check.outputs.already == 'false'
        env:
          VER: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          TARBALL="./dist/shieldfive-mcp-${VER}.tgz"
          test -f "$TARBALL" || { echo "::error::$TARBALL missing from the build artifact"; exit 1; }
          sha256sum "$TARBALL"
          # OIDC: npm exchanges this job's GitHub identity for a short-lived
          # publish credential. Nothing long-lived exists to leak. No checkout,
          # no install: the only code run here is npm itself.
          npm publish "$TARBALL" --provenance --access public --tag "$CHANNEL" --ignore-scripts

  release-asset:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release asset
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          if gh release view "$TAG_REF" >/dev/null 2>&1; then
            gh release upload "$TAG_REF" dist/shieldfive.mcpb --clobber
          else
            gh release create "$TAG_REF" dist/shieldfive.mcpb --title "${TAG_REF#v}" --generate-notes
          fi
